services:
  - type: web
    name: khu-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Historical name kept as fallback in push.py; prefer RAW_B64URL.
      # Value must be raw base64url (32-byte key), NOT a PEM block.
      - key: VAPID_PRIVATE_KEY_RAW_B64URL
        sync: false
      - key: VAPID_PRIVATE_KEY_PEM
        sync: false
      - key: VAPID_PUBLIC_KEY_B64URL
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # JSON list from GET /api/admin/agents/export-seed (keeps agent
      # accounts across cold starts). Secret — never commit it.
      - key: AGENTS_SEED
        sync: false
      - key: KHU_REQUEST_DELAY_SECONDS
        value: "1.0"
      - key: KHU_CHALLENGE_BACKOFF_MULTIPLIER
        value: "3"
      - key: KHU_REFRESH_INTERVAL_MINUTES
        value: "15"
