services:
  - type: web
    name: khu-backend
    runtime: python
    region: oregon
    # Paid instance (no cold starts). Keep this in step with the plan chosen in the Render dashboard.
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Historical name kept as fallback in push.py; prefer RAW_B64URL.
      # Value must be raw base64url (32-byte key), NOT a PEM block.
      - key: VAPID_PRIVATE_KEY_RAW_B64URL
        sync: false
      - key: VAPID_PRIVATE_KEY_PEM
        sync: false
      - key: VAPID_PUBLIC_KEY_B64URL
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # JSON list from GET /api/admin/agents/export-seed (keeps agent
      # accounts across cold starts). Secret — never commit it.
      - key: AGENTS_SEED
        sync: false
      # Optional. Supabase *Session pooler* connection string. Secret — never
      # commit it. When set, data lives in Postgres instead of local SQLite.
      - key: DATABASE_URL
        sync: false
      # Optional off-site nightly backup (S3-compatible bucket). Secrets.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      # Optional shop payments (Safaricom Daraja / M-Pesa). Secrets. See docs/SHOP_SETUP.md.
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_PARTY_B
        sync: false
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: MPESA_CALLBACK_SECRET
        sync: false
      - key: PUBLIC_API_URL
        value: https://khu-backend.onrender.com
      # Optional edge layer (Cloudflare Worker). See docs/EDGE_SETUP.md. Secrets.
      - key: MPESA_CALLBACK_BASE
        sync: false
      - key: EDGE_KEY
        sync: false
      - key: KHU_REQUEST_DELAY_SECONDS
        value: "1.0"
      - key: KHU_CHALLENGE_BACKOFF_MULTIPLIER
        value: "3"
      - key: KHU_REFRESH_INTERVAL_MINUTES
        value: "15"
