<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KHU Live — Agent Portal</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --red: #BB0000; --green: #006600; --bg: #0D0709; --card: #1a1214;
    --border: rgba(255,255,255,0.12); --text: #F5F0F0; --muted: #9A8688; --amber: #F0A500;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); padding: 16px; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  input, select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: var(--text); font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: var(--amber); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--red); color: #fff; font-weight: 700; font-size: 14px;
    cursor: pointer; margin-top: 16px;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
  .msg.success { background: rgba(0,102,0,0.2); border: 1px solid var(--green); display: block; }
  .msg.error { background: rgba(187,0,0,0.2); border: 1px solid var(--red); display: block; }
  .result-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-meta { color: var(--muted); font-size: 11px; }
  .del-btn {
    width: auto; padding: 6px 10px; font-size: 12px; margin: 0;
    background: transparent; border: 1px solid var(--red); color: var(--red);
  }
  .empty-note { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 0; }
  .subsection { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .subsection-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 8px; }
  .optional-tag { font-weight: 400; text-transform: none; opacity: 0.7; }
  .dyn-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .dyn-row select { flex: 1.1; padding: 8px; font-size: 13px; }
  .dyn-row input[type=text], .dyn-row input:not([type]) { flex: 1.4; padding: 8px; font-size: 13px; }
  .dyn-row input[type=number] { flex: 0.6; padding: 8px; font-size: 13px; }
  .dyn-row .remove-row-btn {
    width: auto; margin: 0; padding: 6px 9px; font-size: 12px; flex-shrink: 0;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
  }
  .add-row-btn {
    width: auto; margin: 0; padding: 7px 14px; font-size: 12px; font-weight: 600;
    background: transparent; border: 1px dashed var(--border); color: var(--amber);
  }

  .section-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .welcome-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
  }
  .logout-btn {
    width: auto; margin: 0; padding: 6px 12px; font-size: 12px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
  }
  #loginScreen, #mainScreen { display: none; }
</style>
</head>
<body>

<h1>KHU Live — Agent Portal</h1>
<div class="subtitle">Enter match results you've confirmed. Fills gaps the live scraper hasn't caught yet.</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="card">
    <label>Username</label>
    <input id="username" placeholder="Your username" />

    <label>Password</label>
    <input id="password" type="password" placeholder="Your password" />

    <button id="loginBtn" onclick="login()">Log In</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- MAIN -->
<div id="mainScreen">
  <div class="welcome-bar">
    <span>Logged in as <strong id="welcomeName"></strong></span>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>

  <div class="card">
    <div class="section-title">Add a Result</div>

    <label>League</label>
    <select id="league" onchange="populateTeamDropdowns()">
      <option value="PLM">Premier League Men</option>
      <option value="PLW">Premier League Women</option>
      <option value="SLM">Super League Men</option>
      <option value="SLW">Super League Women</option>
      <option value="NLM-EZ">National League Men — Eastern Zone</option>
      <option value="NLM-CZ">National League Men — Central Zone</option>
      <option value="NLM-WZ">National League Men — Western Zone</option>
      <option value="NLM-SZ">National League Men — Southern Zone</option>
    </select>

    <div class="row">
      <div>
        <label>Home Team</label>
        <select id="homeTeam"><option value="">Select a team...</option></select>
      </div>
      <div>
        <label>Away Team</label>
        <select id="awayTeam"><option value="">Select a team...</option></select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Home Score</label>
        <input id="homeScore" type="number" min="0" placeholder="0" />
      </div>
      <div>
        <label>Away Score</label>
        <input id="awayScore" type="number" min="0" placeholder="0" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Date</label>
        <input id="matchDate" type="date" />
      </div>
      <div>
        <label>Time</label>
        <input id="matchTime" type="time" />
      </div>
    </div>

    <label>Venue (optional)</label>
    <input id="venue" placeholder="e.g. Dashmesh Stadium" />

    <div class="subsection">
      <div class="subsection-title">Goal Scorers <span class="optional-tag">optional</span></div>
      <div id="scorersList"></div>
      <button type="button" class="add-row-btn" onclick="addScorerRow()">+ Add Scorer</button>
    </div>

    <div class="subsection">
      <div class="subsection-title">Cards <span class="optional-tag">optional</span></div>
      <div id="cardsList"></div>
      <button type="button" class="add-row-btn" onclick="addCardRow()">+ Add Card</button>
    </div>

    <button id="submitBtn" onclick="submitResult()">Add Result</button>
    <div id="addMsg" class="msg"></div>
  </div>

  <div class="card">
    <div class="section-title">Recently Entered Results</div>
    <div id="resultsList"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let ALL_TEAMS_CACHE = null;

  async function fetchAllTeams() {
    if (ALL_TEAMS_CACHE) return ALL_TEAMS_CACHE;
    try {
      const res = await fetch(`${apiBase()}/api/teams/all`);
      const data = await res.json();
      ALL_TEAMS_CACHE = data.teams || [];
    } catch (e) {
      ALL_TEAMS_CACHE = [];
    }
    return ALL_TEAMS_CACHE;
  }

  function populateSelectWithTeams(selectId, teams) {
    const sel = $(selectId);
    if (!sel) return;
    const current = sel.value;
    sel.innerHTML = ['<option value="">Select a team...</option>']
      .concat(teams.map((t) => `<option value="${t.name.replace(/"/g, '&quot;')}">${t.name}</option>`))
      .join('');
    if (current && teams.some((t) => t.name === current)) sel.value = current;
  }

  async function populateTeamDropdowns() {
    const allTeams = await fetchAllTeams();

    if ($('league') && $('homeTeam') && $('awayTeam')) {
      const teams = allTeams.filter((t) => t.league_short === $('league').value);
      populateSelectWithTeams('homeTeam', teams);
      populateSelectWithTeams('awayTeam', teams);
      if (typeof updateTeamLabels === 'function') updateTeamLabels();
    }
    if ($('tsLeague') && $('tsTeamName')) {
      populateSelectWithTeams('tsTeamName', allTeams.filter((t) => t.league_short === $('tsLeague').value));
    }
    if ($('psLeague') && $('psTeamName')) {
      populateSelectWithTeams('psTeamName', allTeams.filter((t) => t.league_short === $('psLeague').value));
    }
  }

  function teamLabel(side) {
    const name = $(side === 'home' ? 'homeTeam' : 'awayTeam').value.trim();
    const base = side === 'home' ? 'Home' : 'Away';
    return name ? `${base}: ${name}` : base;
  }

  function updateTeamLabels() {
    document.querySelectorAll('.team-side-select').forEach((sel) => {
      const val = sel.value;
      sel.innerHTML = `<option value="home">${teamLabel('home')}</option><option value="away">${teamLabel('away')}</option>`;
      sel.value = val;
    });
  }

  function addScorerRow() {
    const row = document.createElement('div');
    row.className = 'dyn-row';
    row.innerHTML = `
      <select class="team-side-select"><option value="home">${teamLabel('home')}</option><option value="away">${teamLabel('away')}</option></select>
      <input type="text" placeholder="Player name" class="scorer-name" />
      <input type="number" placeholder="Min" class="scorer-minute" min="0" max="120" />
      <button type="button" class="remove-row-btn" onclick="this.parentElement.remove()">✕</button>
    `;
    $('scorersList').appendChild(row);
  }

  function addCardRow() {
    const row = document.createElement('div');
    row.className = 'dyn-row';
    row.innerHTML = `
      <select class="team-side-select"><option value="home">${teamLabel('home')}</option><option value="away">${teamLabel('away')}</option></select>
      <input type="text" placeholder="Player name" class="card-name" />
      <select class="card-type-select">
        <option value="green">🟩 Green</option>
        <option value="yellow">🟨 Yellow</option>
        <option value="red">🟥 Red</option>
      </select>
      <input type="number" placeholder="Min" class="card-minute" min="0" max="120" />
      <button type="button" class="remove-row-btn" onclick="this.parentElement.remove()">✕</button>
    `;
    $('cardsList').appendChild(row);
  }

  function collectScorers() {
    return Array.from($('scorersList').querySelectorAll('.dyn-row')).map((row) => ({
      team: row.querySelector('.team-side-select').value,
      player_name: row.querySelector('.scorer-name').value.trim(),
      minute: row.querySelector('.scorer-minute').value ? parseInt(row.querySelector('.scorer-minute').value, 10) : null,
    })).filter((s) => s.player_name);
  }

  function collectCards() {
    return Array.from($('cardsList').querySelectorAll('.dyn-row')).map((row) => ({
      team: row.querySelector('.team-side-select').value,
      player_name: row.querySelector('.card-name').value.trim(),
      card_type: row.querySelector('.card-type-select').value,
      minute: row.querySelector('.card-minute').value ? parseInt(row.querySelector('.card-minute').value, 10) : null,
    })).filter((c) => c.player_name);
  }

  function clearScorersAndCards() {
    $('scorersList').innerHTML = '';
    $('cardsList').innerHTML = '';
  }


  // Use local backend when running on localhost, otherwise production.
  // Matches the React app's own API_BASE logic (frontend/.env).
  const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
    ? "http://localhost:8000"
    : "https://khu-backend.onrender.com";

  function apiBase() { return API_BASE; }
  function agentToken() { return localStorage.getItem('khu_agent_token') || ''; }
  function displayName() { return localStorage.getItem('khu_agent_display_name') || ''; }

  function showScreen() {
    if (agentToken()) {
      $('loginScreen').style.display = 'none';
      $('mainScreen').style.display = 'block';
      $('welcomeName').textContent = displayName();
      populateTeamDropdowns();
      loadResults();
    } else {
      $('loginScreen').style.display = 'block';
      $('mainScreen').style.display = 'none';
    }
  }

  async function login() {
    const btn = $('loginBtn');
    const msg = $('loginMsg');
    msg.className = 'msg';

    const username = $('username').value.trim();
    const password = $('password').value;

    if (!username || !password) {
      msg.textContent = 'Fill in your username and password.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch(`${API_BASE}/api/agent/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed.');

      localStorage.setItem('khu_agent_token', data.token);
      localStorage.setItem('khu_agent_display_name', data.display_name);
      showScreen();
    } catch (e) {
      msg.textContent = e.message;
      msg.className = 'msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  }

  function logout() {
    localStorage.removeItem('khu_agent_token');
    localStorage.removeItem('khu_agent_display_name');
    showScreen();
  }

  async function submitResult() {
    const btn = $('submitBtn');
    const msg = $('addMsg');
    msg.className = 'msg';

    const homeTeam = $('homeTeam').value.trim();
    const awayTeam = $('awayTeam').value.trim();
    const homeScore = $('homeScore').value;
    const awayScore = $('awayScore').value;
    const date = $('matchDate').value;
    const time = $('matchTime').value || '00:00';

    if (!homeTeam || !awayTeam || homeScore === '' || awayScore === '' || !date) {
      msg.textContent = 'Fill in home/away team, both scores, and the date.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Adding...';

    try {
      const res = await fetch(`${apiBase()}/api/admin/results/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-agent-token': agentToken() },
        body: JSON.stringify({
          league_short: $('league').value,
          home_team: homeTeam,
          away_team: awayTeam,
          home_score: parseInt(homeScore, 10),
          away_score: parseInt(awayScore, 10),
          date: `${date} ${time}`,
          venue: $('venue').value.trim(),
          scorers: collectScorers(),
          cards: collectCards(),
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) {
          // Session expired or account deactivated — send back to login
          // rather than leaving a confusing dead form on screen.
          logout();
          throw new Error('Your session ended — please log in again.');
        }
        throw new Error(data.detail || 'Something went wrong.');
      }

      const tableNote = data.table_updated
        ? " ✅ Table updated."
        : " ⚠️ Table NOT updated (either this match is already reflected in live standings, or one of the teams isn't found in the current standings cache yet).";
      msg.textContent = `Added: ${homeTeam} ${homeScore} - ${awayScore} ${awayTeam}${tableNote}`;
      msg.className = 'msg success';
      ['homeTeam', 'awayTeam', 'homeScore', 'awayScore', 'venue'].forEach((id) => $(id).value = '');
      clearScorersAndCards();
      loadResults();
    } catch (e) {
      msg.textContent = e.message;
      msg.className = 'msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Result';
    }
  }

  async function loadResults() {
    const container = $('resultsList');
    try {
      const res = await fetch(`${apiBase()}/api/admin/results/list`, {
        headers: { 'x-agent-token': agentToken() },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Could not load results.');

      if (!data.results.length) {
        container.innerHTML = '<div class="empty-note">No manual results entered yet.</div>';
        return;
      }

      container.innerHTML = data.results.map((r) => `
        <div class="result-row">
          <div>
            <div><strong>${r.home_team}</strong> ${r.home_score} - ${r.away_score} <strong>${r.away_team}</strong></div>
            <div class="result-meta">${r.league_short} · ${r.date}${r.entered_by ? ' · by ' + r.entered_by : ''}</div>
          </div>
          <button class="del-btn" onclick="deleteResult('${r.match_key}')">Delete</button>
        </div>
      `).join('');
    } catch (e) {
      container.innerHTML = `<div class="empty-note">${e.message}</div>`;
    }
  }

  async function deleteResult(matchKey) {
    if (!confirm('Delete this result?')) return;
    try {
      const res = await fetch(`${apiBase()}/api/admin/results/${encodeURIComponent(matchKey)}`, {
        method: 'DELETE',
        headers: { 'x-agent-token': agentToken() },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Could not delete.');
      loadResults();
    } catch (e) {
      alert(e.message);
    }
  }

  $('homeTeam').addEventListener('change', updateTeamLabels);
  $('awayTeam').addEventListener('change', updateTeamLabels);

  showScreen();
</script>

</body>
</html>
