<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KHU Live — Agent Portal</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --red: #BB0000; --green: #006600; --bg: #0D0709; --card: #1a1214;
    --border: rgba(255,255,255,0.12); --text: #F5F0F0; --muted: #9A8688; --amber: #F0A500;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); padding: 16px; max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  input, select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: var(--text); font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: var(--amber); }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--red); color: #fff; font-weight: 700; font-size: 14px;
    cursor: pointer; margin-top: 16px;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; display: none; }
  .msg.success { background: rgba(0,102,0,0.2); border: 1px solid var(--green); display: block; }
  .msg.error { background: rgba(187,0,0,0.2); border: 1px solid var(--red); display: block; }
  .result-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-meta { color: var(--muted); font-size: 11px; }
  .del-btn {
    width: auto; padding: 6px 10px; font-size: 12px; margin: 0;
    background: transparent; border: 1px solid var(--red); color: var(--red);
  }
  .empty-note { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 0; }
  .section-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .welcome-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
  }
  .logout-btn {
    width: auto; margin: 0; padding: 6px 12px; font-size: 12px;
    background: transparent; border: 1px solid var(--border); color: var(--muted);
  }
  #loginScreen, #mainScreen { display: none; }
</style>
</head>
<body>

<h1>KHU Live — Agent Portal</h1>
<div class="subtitle">Enter match results you've confirmed. Fills gaps the live scraper hasn't caught yet.</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="card">
    <label>Backend URL</label>
    <input id="apiBase" placeholder="https://khu-backend.onrender.com" />

    <label>Username</label>
    <input id="username" placeholder="Your username" />

    <label>Password</label>
    <input id="password" type="password" placeholder="Your password" />

    <button id="loginBtn" onclick="login()">Log In</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- MAIN -->
<div id="mainScreen">
  <div class="welcome-bar">
    <span>Logged in as <strong id="welcomeName"></strong></span>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>

  <div class="card">
    <div class="section-title">Add a Result</div>

    <label>League</label>
    <select id="league">
      <option value="PLM">Premier League Men</option>
      <option value="PLW">Premier League Women</option>
      <option value="SLM">Super League Men</option>
      <option value="SLW">Super League Women</option>
      <option value="NLM-EZ">National League Men — Eastern Zone</option>
      <option value="NLM-CZ">National League Men — Central Zone</option>
      <option value="NLM-WZ">National League Men — Western Zone</option>
      <option value="NLM-SZ">National League Men — Southern Zone</option>
    </select>

    <div class="row">
      <div>
        <label>Home Team</label>
        <input id="homeTeam" placeholder="e.g. Butali Warriors" />
      </div>
      <div>
        <label>Away Team</label>
        <input id="awayTeam" placeholder="e.g. Kenya Police" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Home Score</label>
        <input id="homeScore" type="number" min="0" placeholder="0" />
      </div>
      <div>
        <label>Away Score</label>
        <input id="awayScore" type="number" min="0" placeholder="0" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Date</label>
        <input id="matchDate" type="date" />
      </div>
      <div>
        <label>Time</label>
        <input id="matchTime" type="time" />
      </div>
    </div>

    <label>Venue (optional)</label>
    <input id="venue" placeholder="e.g. Dashmesh Stadium" />

    <button id="submitBtn" onclick="submitResult()">Add Result</button>
    <div id="addMsg" class="msg"></div>
  </div>

  <div class="card">
    <div class="section-title">Recently Entered Results</div>
    <div id="resultsList"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function apiBase() { return localStorage.getItem('khu_agent_api_base') || ''; }
  function agentToken() { return localStorage.getItem('khu_agent_token') || ''; }
  function displayName() { return localStorage.getItem('khu_agent_display_name') || ''; }

  function showScreen() {
    if (agentToken()) {
      $('loginScreen').style.display = 'none';
      $('mainScreen').style.display = 'block';
      $('welcomeName').textContent = displayName();
      loadResults();
    } else {
      $('loginScreen').style.display = 'block';
      $('mainScreen').style.display = 'none';
      $('apiBase').value = apiBase();
    }
  }

  async function login() {
    const btn = $('loginBtn');
    const msg = $('loginMsg');
    msg.className = 'msg';

    const base = $('apiBase').value.trim().replace(/\/$/, '');
    const username = $('username').value.trim();
    const password = $('password').value;

    if (!base || !username || !password) {
      msg.textContent = 'Fill in the backend URL, username, and password.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch(`${base}/api/agent/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed.');

      localStorage.setItem('khu_agent_api_base', base);
      localStorage.setItem('khu_agent_token', data.token);
      localStorage.setItem('khu_agent_display_name', data.display_name);
      showScreen();
    } catch (e) {
      msg.textContent = e.message;
      msg.className = 'msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Log In';
    }
  }

  function logout() {
    localStorage.removeItem('khu_agent_token');
    localStorage.removeItem('khu_agent_display_name');
    showScreen();
  }

  async function submitResult() {
    const btn = $('submitBtn');
    const msg = $('addMsg');
    msg.className = 'msg';

    const homeTeam = $('homeTeam').value.trim();
    const awayTeam = $('awayTeam').value.trim();
    const homeScore = $('homeScore').value;
    const awayScore = $('awayScore').value;
    const date = $('matchDate').value;
    const time = $('matchTime').value || '00:00';

    if (!homeTeam || !awayTeam || homeScore === '' || awayScore === '' || !date) {
      msg.textContent = 'Fill in home/away team, both scores, and the date.';
      msg.className = 'msg error';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Adding...';

    try {
      const res = await fetch(`${apiBase()}/api/admin/results/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-agent-token': agentToken() },
        body: JSON.stringify({
          league_short: $('league').value,
          home_team: homeTeam,
          away_team: awayTeam,
          home_score: parseInt(homeScore, 10),
          away_score: parseInt(awayScore, 10),
          date: `${date} ${time}`,
          venue: $('venue').value.trim(),
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) {
          // Session expired or account deactivated — send back to login
          // rather than leaving a confusing dead form on screen.
          logout();
          throw new Error('Your session ended — please log in again.');
        }
        throw new Error(data.detail || 'Something went wrong.');
      }

      msg.textContent = `Added: ${homeTeam} ${homeScore} - ${awayScore} ${awayTeam}`;
      msg.className = 'msg success';
      ['homeTeam', 'awayTeam', 'homeScore', 'awayScore', 'venue'].forEach((id) => $(id).value = '');
      loadResults();
    } catch (e) {
      msg.textContent = e.message;
      msg.className = 'msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add Result';
    }
  }

  async function loadResults() {
    const container = $('resultsList');
    try {
      const res = await fetch(`${apiBase()}/api/admin/results/list`, {
        headers: { 'x-agent-token': agentToken() },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Could not load results.');

      if (!data.results.length) {
        container.innerHTML = '<div class="empty-note">No manual results entered yet.</div>';
        return;
      }

      container.innerHTML = data.results.map((r) => `
        <div class="result-row">
          <div>
            <div><strong>${r.home_team}</strong> ${r.home_score} - ${r.away_score} <strong>${r.away_team}</strong></div>
            <div class="result-meta">${r.league_short} · ${r.date}${r.entered_by ? ' · by ' + r.entered_by : ''}</div>
          </div>
          <button class="del-btn" onclick="deleteResult('${r.match_key}')">Delete</button>
        </div>
      `).join('');
    } catch (e) {
      container.innerHTML = `<div class="empty-note">${e.message}</div>`;
    }
  }

  async function deleteResult(matchKey) {
    if (!confirm('Delete this result?')) return;
    try {
      const res = await fetch(`${apiBase()}/api/admin/results/${encodeURIComponent(matchKey)}`, {
        method: 'DELETE',
        headers: { 'x-agent-token': agentToken() },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Could not delete.');
      loadResults();
    } catch (e) {
      alert(e.message);
    }
  }

  showScreen();
</script>

</body>
</html>
